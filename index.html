<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Saeed Ahmed Mohamed — Mobile Developer & Technical Lead. Flutter, native Android, biometrics, eKYC, and IDEMIA/Morpho hardware integration." />
    <meta name="theme-color" content="#030712" />
    <meta property="og:title" content="Saeed Ahmed | Mobile Developer & Technical Lead" />
    <meta property="og:description" content="6+ years shipping Flutter and native Android apps — biometrics, eKYC, and hardware-integrated enterprise products." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Saeed Ahmed | Mobile Developer & Technical Lead</title>
    <script>
      (function () {
        var theme = 'dark'
        try {
          var stored = localStorage.getItem('theme')
          if (stored === 'light' || stored === 'dark') theme = stored
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme)
        document.documentElement.style.colorScheme = theme
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.content = theme === 'light' ? '#f4f7fb' : '#030712'
      })()
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
